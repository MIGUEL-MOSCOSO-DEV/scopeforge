name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ScopeForge-windows-x64
          path: |
            dist/*.zip
            dist/*-cli.exe
            dist/SHA256SUMS.txt
